          invalid_payload: "The delivery could not be decoded. Use GitHub’s JSON or form content type, or GitLab’s standard webhook payload, then test again."
          ignored_event: "This event is not supported. Enable the events in Setup instructions and send a test delivery."
          archived: "This channel is unavailable or archived. Reopen it and enable this repository before testing again."
        missing:
          push: "Pushes are not enabled, so commits will not appear. Edit the webhook and tick Pushes; this warning clears when the first such event arrives."
          workflow_run: "Workflow runs are not enabled, so CI status and failure alerts will not appear. Edit the webhook and tick Workflow runs; this warning clears when the first such event arrives."
          pull_request: "Pull requests are off. Opened and merged PRs will not appear in the stream or chat."
          issues: "Issues are off. Opened issues will not appear in the stream or chat."
          release: "Releases are off. Releases will not appear in the stream or chat."
        copy_steps_github: |
          Open %{settings}
          Payload URL: %{url}
          Content type: either application/json or application/x-www-form-urlencoded.
          Secret: %{secret}
          Choose “Let me select individual events”. Required: Pushes and Workflow runs.
          Optional (untick if you do not want these in chat): Pull requests, Issues, Releases.
          GitHub sends tags with required Pushes; tags cannot be disabled separately.
          Click Add webhook; GitHub sends a ping. Keep SSL verification enabled.
        copy_steps_gitlab: |
          Open %{settings}, then Add new webhook.
          URL: %{url}
          Secret token: %{secret}
          Required triggers: Push events and Pipeline events.
          Optional (untick if you do not want these in chat): Tag push events, Issues events, Merge request events, Releases events.
          Keep SSL verification enabled, then Add webhook.
          On the webhook’s row, choose Test → Push events.
        required: "required"
        optional: "optional · untick if you don’t want these in chat"
        github_tags: "GitHub sends tags with required Pushes; tags cannot be disabled separately."
